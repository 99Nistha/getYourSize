<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GetYourSize</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #1a1a1a;
    }

    .header {
      background: linear-gradient(135deg, #E84C6B, #c73a58);
      padding: 20px 18px 16px;
      color: #fff;
    }

    .logo {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 11px;
      opacity: 0.85;
      line-height: 1.4;
    }

    .body {
      padding: 16px 18px 18px;
    }

    #activate-btn {
      width: 100%;
      padding: 13px;
      background: #E84C6B;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s, transform 0.1s;
      margin-bottom: 10px;
    }

    #activate-btn:hover  { opacity: 0.9; }
    #activate-btn:active { transform: scale(0.98); }

    #activate-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      min-height: 18px;
      line-height: 1.4;
    }

    .status.ok      { color: #16a34a; }
    .status.error   { color: #dc2626; }
    .status.loading { color: #2563eb; }

    .divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 14px 0;
    }

    .how {
      font-size: 11px;
      color: #9ca3af;
      line-height: 1.6;
    }

    .how strong { color: #6b7280; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✦ GetYourSize</div>
    <div class="tagline">Two photos. One size. Works on any fashion site.</div>
  </div>

  <div class="body">
    <button id="activate-btn">📐 Activate on this page</button>
    <div class="status" id="status"></div>

    <hr class="divider">

    <div class="how">
      <strong>How it works</strong><br>
      1. Click activate on a product page<br>
      2. Find the "Get Your Size" button<br>
      3. Take 2 photos → get your size
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
